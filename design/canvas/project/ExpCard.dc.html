<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Experience card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.xc{transition:transform .18s cubic-bezier(.2,.7,.2,1),border-color .12s,box-shadow .18s}
.xc:hover{transform:translateY(-2px);border-color:var(--ink,#121417)!important;box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}
.xc:hover .xc-go{color:var(--accent,#A04A00)}
.xc:hover .xc-arrow{transform:translateX(3px)}
.xc-arrow{display:inline-block;transition:transform .18s cubic-bezier(.2,.7,.2,1)}
.xc:focus-visible{outline:2px solid var(--focus,#1D5BD6);outline-offset:3px}
@media (prefers-reduced-motion: reduce){.xc,.xc-arrow{transition:none}.xc:hover{transform:none}}
</style>
</helmet>
<a class="card xc" href="#" style="display:flex;flex-direction:column;height:100%;box-sizing:border-box;border:1px solid var(--line-strong,#8A8D93);border-radius:14px;overflow:hidden;background:var(--raised,#FFFFFF);color:var(--ink,#121417);text-decoration:none;font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif">
  <div style="border-bottom:1px solid var(--line,#DCDCD5)"><dc-import name="Plate" kind="{{kind}}" radius="0" hint-size="100%,300px"></dc-import></div>
  <div style="flex:1 1 auto;display:flex;flex-direction:column;gap:12px;padding:20px 22px 20px">
    <div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px">
      <h3 style="margin:0;font-size:24px;line-height:1.2;letter-spacing:-0.015em;font-weight:650">{{org}}</h3>
      <span style="font-size:15px;color:var(--muted,#50555E)">{{role}}</span>
      <span style="flex:1 1 auto"></span>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted,#50555E)">{{when}}</span>
    </div>
    <p style="margin:0;font-size:16px;line-height:1.55;color:var(--muted,#50555E)">{{line}}</p>
    <div style="display:flex;align-items:baseline;gap:12px;margin-top:auto;padding-top:12px;border-top:1px dashed var(--line,#DCDCD5)">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:40px;line-height:1;font-weight:600;letter-spacing:-0.02em;color:var(--ink,#121417)">{{metric}}</span>
      <span style="font-size:14px;line-height:1.3;color:var(--muted,#50555E);max-width:14rem">{{metricLabel}}</span>
    </div>
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--subtle,#63686F)">{{stack}}</span>
      <span style="flex:1 1 auto"></span>
      <span class="xc-go" style="font-size:15px;font-weight:500">Case study <span class="xc-arrow" aria-hidden="true">→</span></span>
    </div>
  </div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["tiktok","kovalee","dconstruct","vebits"],"default":"tiktok"},"org":{"editor":null,"default":"TikTok"},"role":{"editor":null},"when":{"editor":null},"line":{"editor":null},"metric":{"editor":null},"metricLabel":{"editor":null},"stack":{"editor":null},"$preview":{"width":560,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      kind: p.kind ?? 'tiktok', org: p.org ?? 'TikTok', role: p.role ?? 'iOS Software Engineer', when: p.when ?? 'Jul 2025 – now',
      line: p.line ?? 'The instant-messaging SDK behind TikTok chat, also used by TikTok Shop and Lemon8.',
      metric: p.metric ?? '−75%', metricLabel: p.metricLabel ?? 'failed message sends, after automatic resend',
      stack: p.stack ?? 'Objective-C · Swift · SQLite · WebSocket'
    };
  }
}
</script>
</body>
</html>
