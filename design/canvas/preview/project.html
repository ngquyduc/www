<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Project local preview</title><style>body{margin:0}</style></head><body><div id="root"></div>
<script>
const TPL = "\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0}\n.th-light{--bg:#F6F6F3;--raised:#FFFFFF;--sunken:#ECECE7;--ink:#121417;--muted:#50555E;--subtle:#63686F;--line:#DCDCD5;--line-strong:#8A8D93;--accent:#A04A00;--accent-soft:#F5E6D3;--on-accent:#FFFFFF;--focus:#1D5BD6;color-scheme:light}\n.th-dark{--bg:#0E1013;--raised:#15181D;--sunken:#0A0B0D;--ink:#E8E8E3;--muted:#A3A8B1;--subtle:#8A9099;--line:#262A31;--line-strong:#646A74;--accent:#F0A848;--accent-soft:#2B2114;--on-accent:#1A1203;--focus:#8AB4FF;color-scheme:dark}\n.pg{container-type:inline-size;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}\n.pg a{color:inherit;text-decoration-color:var(--line-strong);text-underline-offset:3px}\n.pg a:hover{color:var(--accent)}\n.pg :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}\n.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-feature-settings:'tnum' 1,'zero' 1}\n.wrap{max-width:1152px;margin:0 auto;padding:0 24px;box-sizing:border-box;width:100%}\n.ph{background:repeating-linear-gradient(135deg,var(--accent-soft) 0 6px,transparent 6px 12px);outline:1px dashed var(--accent);outline-offset:-1px}\n.navl{text-decoration:none;padding:6px 2px;color:var(--muted)}\n.navl[aria-current=page]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}\n.prose h2{font-size:28px;line-height:1.2;letter-spacing:-0.02em;margin:64px 0 12px;display:flex;gap:14px;align-items:baseline}\n.prose h2 .n{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--accent);font-weight:500}\n.prose p{margin:0 0 16px}\n.live{display:inline-flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}\n.live-dot{position:relative;width:7px;height:7px;border-radius:50%;background:#D92D20}\n.live-dot::after{content:'';position:absolute;inset:0;border-radius:50%;background:#D92D20;animation:live-ping 1.6s cubic-bezier(0,0,.2,1) infinite}\n@keyframes live-ping{75%,100%{transform:scale(2.6);opacity:0}}\n@media (prefers-reduced-motion: reduce){.live-dot::after{animation:none;opacity:0}}\n@container (max-width:760px){.wrap{padding:0 16px}.hdr-nav{order:3;flex-basis:100%;justify-content:flex-start!important}.hide-sm{display:none!important}.d1{font-size:38px!important}.t3{font-size:30px!important}.t2{font-size:24px!important}.col-sm{flex-direction:column!important;align-items:stretch!important}.side{display:none!important}.sec{padding-top:64px!important}.prose h2{font-size:24px}}\n</style>\n</helmet>\n<div class=\"pg {{th}}\" style=\"min-height:100%\">\n  <header style=\"border-bottom:1px solid var(--line)\">\n    <div class=\"wrap\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px;min-height:64px;padding-top:10px;padding-bottom:10px\">\n      <a href=\"#\" style=\"display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)\">\n        <span class=\"mono\" style=\"display:inline-grid;place-items:center;width:30px;height:30px;border-radius:6px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600\">QD</span>\n        <span style=\"font-weight:600;font-size:15px\">Duc Nguyen</span>\n      </a>\n      <nav class=\"hdr-nav\" aria-label=\"Primary\" style=\"display:flex;gap:24px;flex:1 1 auto;justify-content:center;font-size:15px\">\n        <a class=\"navl\" href=\"#\" aria-current=\"page\">Work</a><a class=\"navl\" href=\"#\">Writing</a><a class=\"navl\" href=\"#\">About</a><a class=\"navl\" href=\"#\">Contact</a>\n      </nav>\n      <div style=\"display:flex;gap:8px;align-items:center;margin-left:auto\">\n        <button type=\"button\" class=\"mono\" style=\"display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border:1px solid var(--line-strong);border-radius:8px;background:transparent;color:var(--ink);font-size:12px;cursor:pointer\"><span class=\"hide-sm\">Jump to</span><kbd style=\"font-family:inherit;color:var(--muted)\">\u2318K</kbd></button>\n        <button type=\"button\" onClick=\"{{toggle}}\" aria-label=\"{{toggleLabel}}\" style=\"display:inline-grid;place-items:center;width:40px;height:40px;border:1px solid var(--line-strong);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer\">\n          <sc-if value=\"{{isLight}}\" hint-placeholder-val=\"{{ true }}\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z\"></path></svg></sc-if>\n          <sc-if value=\"{{isDark}}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"4\"></circle><path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"></path></svg></sc-if>\n        </button>\n      </div>\n    </div>\n  </header>\n\n  <main>\n    <section class=\"wrap sec\" style=\"padding-top:56px\">\n      <a href=\"#\" class=\"mono\" style=\"font-size:13px;text-decoration:none;color:var(--muted)\">\u2190 Work \u00b7 Depth projects</a>\n      <div class=\"col-sm\" style=\"display:flex;gap:48px;align-items:flex-end;margin-top:28px\">\n        <div style=\"flex:1 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n            <span class=\"mono\" style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--accent-soft)\">Depth project</span>\n            <span class=\"mono ph\" style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px\">Personal or coursework?</span>\n            <span class=\"mono\" style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px;border:1px solid var(--line-strong)\">Write-up in progress</span>\n          </div>\n          <h1 class=\"t3\" style=\"margin:0;font-size:44px;line-height:1.1;letter-spacing:-0.025em\">Exchange matching engine, in C++ and Go</h1>\n          <p style=\"margin:0;font-size:20px;line-height:1.5;color:var(--muted)\">A limit order book that matches orders by price, then time. I wrote it in C++ and ported it to Go to see what each language costs and buys.</p>\n        </div>\n        <div style=\"flex:0 0 280px;display:flex;flex-direction:column;gap:10px;font-size:15px\">\n          <a href=\"#\" style=\"display:inline-flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 16px;border-radius:8px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:600\">Code (C++) on GitHub <span aria-hidden=\"true\">\u2197</span></a>\n          <span style=\"display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 16px;border-radius:8px;border:1px dashed var(--line-strong);color:var(--muted)\">Go port <span class=\"mono\" style=\"font-size:12px\">private repo</span></span>\n          <a href=\"#try\" class=\"mono\" style=\"font-size:12px;color:var(--muted)\">Try a simulated book below \u2193</a>\n        </div>\n      </div>\n      <dl style=\"display:grid;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));gap:16px 32px;margin:36px 0 0;padding:20px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--line)\">\n        <div><dt class=\"mono\" style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle)\">Languages</dt><dd class=\"mono\" style=\"margin:4px 0 0;font-size:13px\">C++ \u00b7 Go</dd></div>\n        <div><dt class=\"mono\" style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle)\">When</dt><dd style=\"margin:4px 0 0;font-size:15px\"><span class=\"ph\" style=\"padding:0 4px\">[dates]</span></dd></div>\n        <div><dt class=\"mono\" style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle)\">With</dt><dd style=\"margin:4px 0 0;font-size:15px\"><span class=\"ph\" style=\"padding:0 4px\">[solo, or co-authors]</span></dd></div>\n        <div><dt class=\"mono\" style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle)\">Status</dt><dd style=\"margin:4px 0 0;font-size:15px\">Benchmarks pending</dd></div>\n      </dl>\n    </section>\n\n    <section class=\"wrap\" style=\"padding-top:24px\">\n      <article class=\"prose\" style=\"max-width:56rem\">\n        <h2><span class=\"n\">01</span>Problem</h2>\n        <p style=\"max-width:40rem\"><span class=\"ph\" style=\"padding:0 4px\">[Two or three sentences: what a matching engine must guarantee (price-time priority, no crossed book, every fill accounted for) and what you set out to learn.]</span></p>\n\n        <h2><span class=\"n\">02</span>Architecture</h2>\n        <figure style=\"margin:0 0 16px\">\n          <div class=\"ph\" style=\"aspect-ratio:16/7;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px\">\n            <span class=\"mono\" style=\"font-size:12px;letter-spacing:.06em;text-transform:uppercase\">Architecture diagram slot</span>\n            <span style=\"font-size:14px;color:var(--muted);max-width:34rem\">Inline SVG drawn from the real code: order intake \u2192 book (bid and ask price levels, FIFO queue per level) \u2192 trade output. Uses currentColor so it works in both themes. Width 100%, 16:7.</span>\n          </div>\n          <figcaption style=\"margin-top:8px;font-size:14px;color:var(--muted)\">Fig. 1 \u00b7 <span class=\"ph\" style=\"padding:0 4px\">[caption]</span></figcaption>\n        </figure>\n        <p style=\"max-width:40rem\"><span class=\"ph\" style=\"padding:0 4px\">[Data structures and why: e.g. how a price level is stored, how cancels find an order, what the hot path allocates.]</span></p>\n\n        <h2 id=\"try\"><span class=\"n\">\u21b3</span>Try it</h2>\n          <p style=\"margin:-4px 0 12px\"><span class=\"live\"><span class=\"live-dot\" aria-hidden=\"true\"></span>Live \u00b7 try it</span></p>\n        <p style=\"max-width:40rem;color:var(--muted)\">A small simulated book running in your browser, with the same price-time rules as the engine. Press Buy 10 or Sell 10 to see a market order walk the book. It is a toy for intuition, not the engine and not market data.</p>\n        <div style=\"max-width:720px;margin:0 0 16px\">\n          <dc-import name=\"OrderBook\" mode=\"live\" seed=\"7\" tape-rows=\"8\" hint-size=\"100%,640px\"></dc-import>\n        </div>\n\n        <h2><span class=\"n\">03</span>Benchmarks</h2>\n        <p style=\"max-width:40rem;color:var(--muted)\">Every number on this page comes from a run you can reproduce. Until the runs exist, the slots stay empty on purpose.</p>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit, minmax(170px, 1fr));gap:12px;margin:0 0 20px\">\n          <sc-for list=\"{{metrics}}\" as=\"m\" hint-placeholder-count=\"4\">\n            <div class=\"ph\" style=\"padding:16px;border-radius:8px\">\n              <p class=\"mono\" style=\"margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase\">{{m.k}}</p>\n              <p class=\"mono\" style=\"margin:6px 0 0;font-size:28px;font-weight:600\">\u2014</p>\n              <p style=\"margin:2px 0 0;font-size:13px\">Run benchmarks, then fill in</p>\n            </div>\n          </sc-for>\n        </div>\n        <figure style=\"margin:0 0 16px;padding:20px;border:1px solid var(--line-strong);border-radius:8px;background:var(--raised)\">\n          <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-bottom:12px\">\n            <span style=\"font-weight:600\">Latency by percentile, C++ vs Go</span>\n            <span class=\"mono\" style=\"font-size:12px;color:var(--muted)\">legend: C++ \u25a0 solid \u00b7 Go \u25a0 hatched (not colour alone)</span>\n          </div>\n          <div style=\"position:relative;height:300px;border-left:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);margin-left:40px\">\n            <div style=\"position:absolute;left:0;right:0;top:25%;border-top:1px dashed var(--line)\"></div>\n            <div style=\"position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--line)\"></div>\n            <div style=\"position:absolute;left:0;right:0;top:75%;border-top:1px dashed var(--line)\"></div>\n            <span class=\"mono\" style=\"position:absolute;left:-40px;top:-8px;font-size:11px;color:var(--subtle)\">\u00b5s</span>\n            <div class=\"ph\" style=\"position:absolute;inset:40px 15%;display:grid;place-items:center;border-radius:8px;text-align:center;padding:12px\"><span class=\"mono\" style=\"font-size:12px;letter-spacing:.06em;text-transform:uppercase\">Benchmark chart slot \u00b7 run benchmarks, then fill in</span></div>\n            <div class=\"mono\" style=\"position:absolute;left:0;right:0;bottom:-24px;display:flex;justify-content:space-around;font-size:11px;color:var(--subtle)\"><span>p50</span><span>p90</span><span>p99</span><span>p99.9</span></div>\n          </div>\n          <figcaption style=\"margin-top:36px;font-size:14px;color:var(--muted)\">Fig. 2 \u00b7 Chart is static SVG generated at build time from <code class=\"mono\" style=\"font-size:13px\">src/content/work/matching-engine/bench.json</code>. A table of the same numbers sits beneath it for screen readers and copy-paste.</figcaption>\n        </figure>\n        <details style=\"margin:0 0 16px;padding:14px 16px;border:1px solid var(--line-strong);border-radius:8px\" open=\"open\">\n          <summary style=\"cursor:pointer;font-weight:600\">Method</summary>\n          <dl style=\"display:grid;grid-template-columns:160px 1fr;gap:6px 16px;margin:12px 0 0;font-size:15px\">\n            <dt class=\"mono\" style=\"font-size:12px;color:var(--subtle)\">MACHINE</dt><dd style=\"margin:0\"><span class=\"ph\" style=\"padding:0 4px\">[CPU, cores, RAM, OS]</span></dd>\n            <dt class=\"mono\" style=\"font-size:12px;color:var(--subtle)\">BUILD</dt><dd style=\"margin:0\"><span class=\"ph\" style=\"padding:0 4px\">[compiler + flags; Go version]</span></dd>\n            <dt class=\"mono\" style=\"font-size:12px;color:var(--subtle)\">WORKLOAD</dt><dd style=\"margin:0\"><span class=\"ph\" style=\"padding:0 4px\">[order mix, book depth, number of orders]</span></dd>\n            <dt class=\"mono\" style=\"font-size:12px;color:var(--subtle)\">MEASURED</dt><dd style=\"margin:0\"><span class=\"ph\" style=\"padding:0 4px\">[what one latency sample spans; warm-up; runs]</span></dd>\n            <dt class=\"mono\" style=\"font-size:12px;color:var(--subtle)\">REPRODUCE</dt><dd style=\"margin:0\"><code class=\"mono ph\" style=\"font-size:13px;padding:0 4px\">[command]</code></dd>\n          </dl>\n        </details>\n\n        <h2><span class=\"n\">04</span>Findings</h2>\n        <ol style=\"margin:0 0 16px;padding-left:22px;max-width:40rem\">\n          <li style=\"margin-bottom:10px\"><span class=\"ph\" style=\"padding:0 4px\">[Finding, backed by a number from the table above.]</span></li>\n          <li style=\"margin-bottom:10px\"><span class=\"ph\" style=\"padding:0 4px\">[Finding.]</span></li>\n          <li style=\"margin-bottom:10px\"><span class=\"ph\" style=\"padding:0 4px\">[A surprise, or something that did not work.]</span></li>\n        </ol>\n\n        <h2><span class=\"n\">05</span>Next</h2>\n        <p style=\"max-width:40rem\"><span class=\"ph\" style=\"padding:0 4px\">[What you would build next, e.g. replaying a recorded order trace through the demo book above.]</span></p>\n      </article>\n    </section>\n  </main>\n\n  <footer style=\"border-top:1px solid var(--line);margin-top:96px\">\n    <div class=\"wrap\" style=\"display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between;align-items:baseline;padding-top:28px;padding-bottom:40px;font-size:14px;color:var(--muted)\">\n      <span>\u00a9 2026 Nguyen Quy Duc \u00b7 Built with Astro</span>\n      <nav aria-label=\"Elsewhere\" style=\"display:flex;flex-wrap:wrap;gap:8px 20px\"><a href=\"#\" rel=\"me\">GitHub</a><a href=\"#\" rel=\"me\">LinkedIn</a><a href=\"#\" rel=\"me\">Instagram</a><a href=\"#\">R\u00e9sum\u00e9 (PDF)</a></nav>\n      <span class=\"mono hide-sm\" style=\"font-size:12px\">Press \u2318K to jump anywhere</span>\n    </div>\n  </footer>\n</div>\n";
class DCLogic { constructor(p){ this.props=p||{}; } setState(){} forceUpdate(){} }
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const t = s.t || this.props.theme || 'light';
    return {
      th: t === 'dark' ? 'th-dark' : 'th-light', isDark: t === 'dark', isLight: t !== 'dark',
      toggleLabel: t === 'dark' ? 'Switch to light theme' : 'Switch to dark theme',
      toggle: () => this.setState({ t: t === 'dark' ? 'light' : 'dark' }),
      metrics: [{ k: 'Throughput (orders/s)' }, { k: 'p50 latency' }, { k: 'p99 latency' }, { k: 'C++ vs Go, p99' }]
    };
  }
}

const tplDoc = new DOMParser().parseFromString('<body>' + TPL + '</body>', 'text/html');
const helmet = tplDoc.querySelector('helmet');
if (helmet) { helmet.querySelectorAll('style,link').forEach(n => document.head.appendChild(n.cloneNode(true))); helmet.remove(); }
function look(path, scopes){ path = path.trim(); if (path === 'true') return true; if (path === 'false') return false; const parts = path.split('.'); for (let i = scopes.length-1; i >= 0; i--){ if (scopes[i] && parts[0] in scopes[i]){ let v = scopes[i][parts[0]]; for (const p of parts.slice(1)) v = v == null ? undefined : v[p]; return v; } } return undefined; }
function interp(str, scopes){ const whole = str.match(/^\s*\{\{([^}]+)\}\}\s*$/); if (whole) return look(whole[1], scopes); return str.replace(/\{\{([^}]+)\}\}/g, (_, p) => { const v = look(p, scopes); return v == null ? '' : String(v); }); }
const EV = { onClick:'click', onPointerDown:'pointerdown', onPointerUp:'pointerup', onPointerLeave:'pointerleave', onContextMenu:'contextmenu', onKeyDown:'keydown', onChange:'input', onMouseMove:'mousemove' };
function render(node, scopes, out){
  for (const ch of node.childNodes){
    if (ch.nodeType === 3){ out.appendChild(document.createTextNode(interp(ch.nodeValue, scopes) ?? '')); continue; }
    if (ch.nodeType !== 1) continue;
    const tag = ch.localName;
    if (tag === 'sc-if'){ if (interp(ch.getAttribute('value'), scopes)) render(ch, scopes, out); continue; }
    if (tag === 'sc-for'){ const list = interp(ch.getAttribute('list'), scopes) || []; const as = ch.getAttribute('as'); list.forEach((it, i) => render(ch, scopes.concat([{ [as]: it, $index: i }]), out)); continue; }
    const el = ch.namespaceURI === 'http://www.w3.org/2000/svg' ? document.createElementNS(ch.namespaceURI, tag) : document.createElement(tag);
    for (const a of ch.attributes){
      const name = a.name.startsWith('on') ? Object.keys(EV).find(k => k.toLowerCase() === a.name) : null;
      if (name){ const fn = interp(a.value, scopes); if (typeof fn === 'function') el.addEventListener(EV[name], fn); continue; }
      const v = interp(a.value, scopes);
      if (a.name === 'value' && tag === 'input'){ el.value = v ?? ''; continue; }
      if (a.name === 'autofocus') continue;
      el.setAttribute(a.name, v == null ? '' : String(v));
    }
    render(ch, scopes, el); out.appendChild(el);
  }
}

const c = new Component({}); const vals = c.renderVals();
render(tplDoc.body, [vals], document.getElementById('root'));
</script></body></html>
