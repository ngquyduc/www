<!doctype html><html lang="en"><head><meta charset="utf-8"><title>NotFound local preview</title><style>body{margin:0}</style></head><body><div id="root"></div>
<script>
const TPL = "\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0}\n.th-light{--bg:#F6F6F3;--raised:#FFFFFF;--sunken:#ECECE7;--ink:#121417;--muted:#50555E;--subtle:#63686F;--line:#DCDCD5;--line-strong:#8A8D93;--accent:#A04A00;--mark-x:#F5B041;--accent-soft:#F5E6D3;--on-accent:#FFFFFF;--focus:#1D5BD6;color-scheme:light}\n.th-dark{--bg:#0E1013;--raised:#15181D;--sunken:#0A0B0D;--ink:#E8E8E3;--muted:#A3A8B1;--subtle:#8A9099;--line:#262A31;--line-strong:#646A74;--accent:#F0A848;--mark-x:#A04A00;--accent-soft:#2B2114;--on-accent:#1A1203;--focus:#8AB4FF;color-scheme:dark}\n.pg{container-type:inline-size;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}\n.pg a{color:inherit;text-decoration-color:var(--line-strong);text-underline-offset:3px}\n.pg a:hover{color:var(--accent)}\n.pg :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}\n.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-feature-settings:'tnum' 1,'zero' 1}\n.wrap{max-width:1152px;margin:0 auto;padding:0 24px;box-sizing:border-box;width:100%}\n.navl{text-decoration:none;padding:6px 2px;color:var(--muted)}\n@container (max-width:760px){.wrap{padding:0 16px}.hdr-nav{order:3;flex-basis:100%;justify-content:flex-start!important}.hide-sm{display:none!important}.t3{font-size:30px!important}.sec{padding-top:64px!important}}\n</style>\n</helmet>\n<div class=\"pg {{th}}\" style=\"min-height:100%\">\n  <header style=\"border-bottom:1px solid var(--line)\">\n    <div class=\"wrap\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px;min-height:64px;padding-top:10px;padding-bottom:10px\">\n      <a href=\"#\" style=\"display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)\">\n        <svg aria-hidden=\"true\" width=\"30\" height=\"30\" viewBox=\"0 0 32 32\" style=\"display:block;flex:none\"><rect width=\"32\" height=\"32\" rx=\"7\" fill=\"var(--ink)\"></rect><g transform=\"translate(-0.9 0.4)\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path stroke=\"var(--bg)\" d=\"M19.2 18.6C18.2 14.6 10.2 14.1 9.6 19.6C9.1 24.6 16.2 25.6 18.7 20C21.2 14.4 23 9.6 22 6.9C21 4.4 16.9 5 17.4 9C17.8 12.8 18.2 20 19.8 23C20.6 24.5 22.6 24.6 24.6 23.2\"></path><path stroke=\"var(--mark-x)\" d=\"M14 12.6H23\"></path></g></svg>\n        <span style=\"font-weight:600;font-size:15px\">Duc Nguyen</span>\n      </a>\n      <nav class=\"hdr-nav\" aria-label=\"Primary\" style=\"display:flex;gap:24px;flex:1 1 auto;justify-content:center;font-size:15px\">\n        <a class=\"navl\" href=\"#\">Work</a><a class=\"navl\" href=\"#\">Writing</a><a class=\"navl\" href=\"#\">About</a><a class=\"navl\" href=\"#\">Contact</a>\n      </nav>\n      <div style=\"display:flex;gap:8px;align-items:center;margin-left:auto\">\n        <button type=\"button\" class=\"mono\" style=\"display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border:1px solid var(--line-strong);border-radius:8px;background:transparent;color:var(--ink);font-size:12px;cursor:pointer\"><span class=\"hide-sm\">Jump to</span><kbd style=\"font-family:inherit;color:var(--muted)\">\u2318K</kbd></button>\n        <button type=\"button\" onClick=\"{{toggle}}\" aria-label=\"{{toggleLabel}}\" style=\"display:inline-grid;place-items:center;width:40px;height:40px;border:1px solid var(--line-strong);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer\">\n          <sc-if value=\"{{isLight}}\" hint-placeholder-val=\"{{ true }}\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z\"></path></svg></sc-if>\n          <sc-if value=\"{{isDark}}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"4\"></circle><path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"></path></svg></sc-if>\n        </button>\n      </div>\n    </div>\n  </header>\n\n  <main class=\"wrap sec\" style=\"padding-top:96px;padding-bottom:40px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:40px 64px;align-items:center\">\n      <div style=\"flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:16px\">\n        <p class=\"mono\" style=\"margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)\">404 \u00b7 Not found</p>\n        <h1 class=\"t3\" style=\"margin:0;font-size:44px;line-height:1.1;letter-spacing:-0.025em\">This page was never delivered.</h1>\n        <p style=\"margin:0;font-size:20px;color:var(--muted)\">This page doesn't exist, or it moved when the site was rebuilt. Try one of these:</p>\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:8px\">\n          <a href=\"#\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:8px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:600;font-size:15px\">Home</a>\n          <a href=\"#\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line-strong);text-decoration:none;font-weight:500;font-size:15px\">Work</a>\n          <button type=\"button\" class=\"mono\" style=\"min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line-strong);background:transparent;color:var(--ink);font-size:13px;cursor:pointer\">Search with \u2318K</button>\n        </div>\n      </div>\n      <div aria-hidden=\"true\" class=\"mono\" style=\"flex:1 1 380px;min-width:0;background:#0B0D10;color:#E6E8EB;border:1px solid #242932;border-radius:14px;overflow:hidden;font-size:13px;line-height:1.7\">\n        <div style=\"display:flex;gap:10px;align-items:center;padding:10px 16px;background:#12151A;border-bottom:1px solid #242932;font-size:12px;color:#98A1AE\">ROUTER <span style=\"margin-left:auto;color:#F5B041;border:1px solid #F5B041;border-radius:4px;padding:0 6px;font-size:11px;letter-spacing:.08em\">NO MATCH</span></div>\n        <div style=\"padding:16px\">\n          <div><span style=\"color:#98A1AE\">&gt;</span> GET <span style=\"color:#F5B041\">{{path}}</span></div>\n          <div style=\"color:#98A1AE\">  attempt 1 \u2026 no route \u00b7 attempt 2 \u2026 no route</div>\n          <div><span style=\"color:#FF7A7A\">  404</span> not found \u00b7 gave up, no retry will help</div>\n          <div style=\"color:#98A1AE\">  nearest routes: <span style=\"color:#3DDC84\">/work</span> \u00b7 <span style=\"color:#3DDC84\">/writing</span> \u00b7 <span style=\"color:#3DDC84\">/about</span></div>\n        </div>\n      </div>\n    </div>\n  </main>\n\n  <footer style=\"border-top:1px solid var(--line);margin-top:96px\">\n    <div class=\"wrap\" style=\"display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between;align-items:baseline;padding-top:28px;padding-bottom:40px;font-size:14px;color:var(--muted)\">\n      <span>\u00a9 2026 Nguyen Quy Duc \u00b7 Built with Astro</span>\n      <nav aria-label=\"Elsewhere\" style=\"display:flex;flex-wrap:wrap;gap:8px 20px\"><a href=\"#\" rel=\"me\">GitHub</a><a href=\"#\" rel=\"me\">LinkedIn</a><a href=\"#\" rel=\"me\">Instagram</a><a href=\"#\">R\u00e9sum\u00e9 (PDF)</a></nav>\n      <span class=\"mono hide-sm\" style=\"font-size:12px\">Press \u2318K to jump anywhere</span>\n    </div>\n  </footer>\n</div>\n";
class DCLogic { constructor(p){ this.props=p||{}; } setState(){} forceUpdate(){} }
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const t = s.t || this.props.theme || 'light';
    return {
      th: t === 'dark' ? 'th-dark' : 'th-light', isDark: t === 'dark', isLight: t !== 'dark',
      toggleLabel: t === 'dark' ? 'Switch to light theme' : 'Switch to dark theme',
      toggle: () => this.setState({ t: t === 'dark' ? 'light' : 'dark' }),
      path: '/projects/old-page'
    };
  }
}

const tplDoc = new DOMParser().parseFromString('<body>' + TPL + '</body>', 'text/html');
const helmet = tplDoc.querySelector('helmet');
if (helmet) { helmet.querySelectorAll('style,link').forEach(n => document.head.appendChild(n.cloneNode(true))); helmet.remove(); }
function look(path, scopes){ path = path.trim(); if (path === 'true') return true; if (path === 'false') return false; const parts = path.split('.'); for (let i = scopes.length-1; i >= 0; i--){ if (scopes[i] && parts[0] in scopes[i]){ let v = scopes[i][parts[0]]; for (const p of parts.slice(1)) v = v == null ? undefined : v[p]; return v; } } return undefined; }
function interp(str, scopes){ const whole = str.match(/^\s*\{\{([^}]+)\}\}\s*$/); if (whole) return look(whole[1], scopes); return str.replace(/\{\{([^}]+)\}\}/g, (_, p) => { const v = look(p, scopes); return v == null ? '' : String(v); }); }
const EV = { onClick:'click', onPointerDown:'pointerdown', onPointerUp:'pointerup', onPointerLeave:'pointerleave', onContextMenu:'contextmenu', onKeyDown:'keydown', onChange:'input', onMouseMove:'mousemove' };
function render(node, scopes, out){
  for (const ch of node.childNodes){
    if (ch.nodeType === 3){ out.appendChild(document.createTextNode(interp(ch.nodeValue, scopes) ?? '')); continue; }
    if (ch.nodeType !== 1) continue;
    const tag = ch.localName;
    if (tag === 'sc-if'){ if (interp(ch.getAttribute('value'), scopes)) render(ch, scopes, out); continue; }
    if (tag === 'sc-for'){ const list = interp(ch.getAttribute('list'), scopes) || []; const as = ch.getAttribute('as'); list.forEach((it, i) => render(ch, scopes.concat([{ [as]: it, $index: i }]), out)); continue; }
    const el = ch.namespaceURI === 'http://www.w3.org/2000/svg' ? document.createElementNS(ch.namespaceURI, tag) : document.createElement(tag);
    for (const a of ch.attributes){
      const name = a.name.startsWith('on') ? Object.keys(EV).find(k => k.toLowerCase() === a.name) : null;
      if (name){ const fn = interp(a.value, scopes); if (typeof fn === 'function') el.addEventListener(EV[name], fn); continue; }
      const v = interp(a.value, scopes);
      if (a.name === 'value' && tag === 'input'){ el.value = v ?? ''; continue; }
      if (a.name === 'autofocus') continue;
      el.setAttribute(a.name, v == null ? '' : String(v));
    }
    render(ch, scopes, el); out.appendChild(el);
  }
}

const c = new Component({}); const vals = c.renderVals();
render(tplDoc.body, [vals], document.getElementById('root'));
</script></body></html>
