class DCLogic { constructor(p){ this.props=p||{}; } setState(){} forceUpdate(){} }
class Component extends DCLogic {
  boot() {

      this.asks.push({ p: 10001 + i, q: this.ri(6, 24) + i * 4 });
      this.bids.push({ p: 9999 - i, q: this.ri(6, 24) + i * 4 });
    }
    for (let k = 0; k < 8; k++) { this.ticks++; this.fill(this.rnd() < 0.5 ? 'buy' : 'sell', this.ri(1, 8), 'sim'); }

    if (mode === 'filled') { this.ticks++; this.market('buy'); }
  }
  digits(str, width) {
    const s = String(str); const pad = Math.max(0, (width || 0) - s.length);

    for (const ch of s) {
      if (ch >= '0' && ch <= '9') out.push({ dig: true, sep: false, y: '-' + ((+ch + 1) * 1.4).toFixed(1) + 'em' });
      else out.push({ dig: false, sep: true, ch: ch });
    }
    return out;
  }
  ri(lo, hi) { return lo + Math.floor(this.rnd() * (hi - lo + 1)); }
  fmt(c) { return (c / 100).toFixed(2); }
  clock() {
    const s = this.ticks * 0.7; const m = Math.floor(s / 60); const r = s - m * 60;
    return String(m).padStart(2, '0') + ':' + r.toFixed(1).padStart(4, '0');
  }
  refill() {
    while (this.asks.length < 8) { const base = this.asks.length ? this.asks[this.asks.length - 1].p : this.bids[0].p; this.asks.push({ p: base + 1, q: this.ri(10, 40) }); }
    while (this.bids.length < 8) { const base = this.bids.length ? this.bids[this.bids.length - 1].p : this.asks[0].p; this.bids.push({ p: base - 1, q: this.ri(10, 40) }); }
    if (this.asks[0].p - this.bids[0].p > 2 && this.rnd() < 0.6) {
      if (this.rnd() < 0.5) this.asks.unshift({ p: this.asks[0].p - 1, q: this.ri(3, 12) });

    if (this.bids.length > 8) this.bids.length = 8;

  fill(side, qty, who) {

    const prev = this.last; const fills = [];
    let left = qty, notional = 0;
    while (left > 0 && book.length) {

      if (l.q === 0) book.shift();

  tick() {

    const bc = b5.map((l) => (cb += l.q));

      t: t.t, side: t.side === 'buy' ? 'BUY' : 'SELL', color: t.side === 'buy' ? '#3DDC84' : '#FF7A7A', q: t.q,
      price: Number.isInteger(t.avg) ? (t.avg / 100).toFixed(2) : (t.avg / 100).toFixed(3),
      you: t.who === 'you', bg: t.who === 'you' ? 'rgba(245,176,65,.14)' : 'transparent'

      asks, bids, tape,
      last: this.fmt(this.last), lastD: this.digits(this.fmt(this.last)),
      lastArrow: this.dir > 0 ? '▲' : this.dir < 0 ? '▼' : '',
      lastColor: this.dir > 0 ? '#3DDC84' : this.dir < 0 ? '#FF7A7A' : '#E6E8EB',
      mid: ((this.asks[0].p + this.bids[0].p) / 200).toFixed(3),
      midD: this.digits(((this.asks[0].p + this.bids[0].p) / 200).toFixed(3)),
      spread: this.fmt(this.asks[0].p - this.bids[0].p),
      spreadD: this.digits(this.fmt(this.asks[0].p - this.bids[0].p)),
      bestAsk: this.fmt(this.asks[0].p), bestBid: this.fmt(this.bids[0].p),
      bestAskD: this.digits(this.fmt(this.asks[0].p)), bestBidD: this.digits(this.fmt(this.bids[0].p)),
      statusWord: this.paused ? (reducedIdle ? 'PAUSED · REDUCED MOTION' : 'PAUSED') : 'LIVE',
      dot: this.paused ? '#98A1AE' : '#3DDC84',
      pauseLabel: this.paused ? 'Play' : 'Pause',
      showStep: this.paused,
      msg: this.msg || (reducedIdle ? 'Auto-updates are off because your device asks for reduced motion. Press Play or Step, or place an order.' : 'Place a market order. It fills against the best price on the other side.'),
      msgColor: this.msg ? '#E6E8EB' : '#98A1AE',
      togglePause: () => { this.paused = !this.paused; if (this.paused) this.stop(); else this.start(); this.setState({ v: ++this.n }); },
      step: () => this.tick(),
      buy: () => { this.ticks++; this.market('buy'); this.setState({ v: ++this.n }); },
      sell: () => { this.ticks++; this.market('sell'); this.setState({ v: ++this.n }); }

const tplDoc = new DOMParser().parseFromString('<body>' + TPL + '</body>', 'text/html');
const helmet = tplDoc.querySelector('helmet');

function look(path, scopes){ path = path.trim(); if (path === 'true') return true; if (path === 'false') return false; const parts = path.split('.'); for (let i = scopes.length-1; i >= 0; i--){ if (scopes[i] && parts[0] in scopes[i]){ let v = scopes[i][parts[0]]; for (const p of parts.slice(1)) v = v == null ? undefined : v[p]; return v; } } return undefined; }

const EV = { onClick:'click', onPointerDown:'pointerdown', onPointerUp:'pointerup', onPointerLeave:'pointerleave', onContextMenu:'contextmenu', onKeyDown:'keydown', onChange:'input', onMouseMove:'mousemove' };

    if (tag === 'sc-for'){ const list = interp(ch.getAttribute('list'), scopes) || []; const as = ch.getAttribute('as'); list.forEach((it, i) => render(ch, scopes.concat([{ [as]: it, $index: i }]), out)); continue; }
    const el = ch.namespaceURI === 'http://www.w3.org/2000/svg' ? document.createElementNS(ch.namespaceURI, tag) : document.createElement(tag);
    for (const a of ch.attributes){
      const name = a.name.startsWith('on') ? Object.keys(EV).find(k => k.toLowerCase() === a.name) : null;
      if (name){ const fn = interp(a.value, scopes); if (typeof fn === 'function') el.addEventListener(EV[name], fn); continue; }
      const v = interp(a.value, scopes);
      if (a.name === 'value' && tag === 'input'){ el.value = v ?? ''; continue; }
      if (a.name === 'autofocus') continue;
      el.setAttribute(a.name, v == null ? '' : String(v));
    }
    render(ch, scopes, el); out.appendChild(el);
  }
}

const c = new Component({}); const vals = c.renderVals();
render(tplDoc.body, [vals], document.getElementById('root'));
